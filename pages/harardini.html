<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Until I Found You ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="../css/harandini.css?v=7"
    />
  </head>

  <body>

    <main class="harandini-page">

      <!-- =====================================
           MOON / NIGHT BACKGROUND
      ====================================== -->

      <video
        id="moonBackground"
        class="moon-background"
        muted
        playsinline
        autoplay
        loop
        preload="auto"
      >
        <source
          src="../assets/videos/moonbg.mp4"
          type="video/mp4"
        />
      </video>

      <div class="night-overlay"></div>


      <!-- =====================================
           MOON MUSIC
      ====================================== -->

      <audio
        id="moonMusic"
        src="../assets/music/moon.mp3"
        preload="auto"
        loop
      ></audio>


      <!-- =====================================
           MEMORY WALL
      ====================================== -->

      <section
        id="memorySection"
        class="memory-section"
      >

        <header class="memory-header">

          <div class="memory-kicker">
            until i found you
          </div>

          <h1>
            Our little memories
          </h1>

          <p>
            14 little pieces of us.
            Open every one.
          </p>

        </header>


        <!-- ===================================
             ACTUAL WARM LIGHT PNG
        ==================================== -->

        <div
          class="light-wall"
          aria-hidden="true"
        >

          <img
            class="warm-light"
            src="../assets/images/warm-lights.png"
            alt=""
            draggable="false"
          />

        </div>


        <!-- ===================================
             POLAROID WALL
        ==================================== -->

        <div
          id="memoryGrid"
          class="memory-grid"
        ></div>


        <div
          id="memoryProgress"
          class="memory-progress"
        >

          <span id="memoryProgressText">
            0 / 14 memories
          </span>

          <div
            class="memory-dots"
            aria-hidden="true"
          ></div>

        </div>

      </section>


      <!-- =====================================
           STORY MODAL
      ====================================== -->

      <div
        id="storyModal"
        class="story-modal"
        aria-hidden="true"
      >

        <div
          id="storyBackdrop"
          class="story-backdrop"
        ></div>

        <article
          id="storyCard"
          class="story-card"
        >

          <div class="story-photo-wrap">

            <img
              id="storyPhoto"
              class="story-photo"
              src=""
              alt=""
            />

          </div>


          <div class="story-content">

            <div
              id="storyNumber"
              class="story-number"
            >
              MEMORY 01
            </div>

            <h2
              id="storyTitle"
            ></h2>

            <p
              id="storyText"
            ></p>

            <button
              id="storyDone"
              class="story-done"
              type="button"
            >
              This one's ours ❤️
            </button>

          </div>

        </article>

      </div>


      <!-- =====================================
           LETTER
      ====================================== -->

      <div
        id="letterGate"
        class="letter-gate"
        aria-hidden="true"
      >

        <div class="letter-intro">

          <div class="letter-seal">
            ♡
          </div>

          <div class="letter-kicker">
            14 memories later...
          </div>

          <h2>
            One last little thing
          </h2>

          <p>
            I kept something for you.
          </p>

        </div>


        <div
          id="letterBox"
          class="letter-box"
        >

          <div class="letter-envelope">

            <div class="envelope-back"></div>

            <div class="envelope-paper">

              <div class="paper-heart">
                ♥
              </div>

              <div class="paper-label">
                for kaju
              </div>

              <div class="paper-line">
                one more story...
              </div>

            </div>

            <div class="envelope-front"></div>

            <div class="envelope-flap"></div>

          </div>


          <button
            id="openLetter"
            class="open-letter"
            type="button"
          >
            Open the letter 💌
          </button>

        </div>

      </div>


      <!-- =====================================
           UNTIL I FOUND YOU EDIT
      ====================================== -->

      <div
        id="editStage"
        class="edit-stage"
        aria-hidden="true"
      >

        <video
          id="untilEdit"
          class="until-edit"
          playsinline
          preload="auto"
        >
          <source
            src="../assets/videos/Untill-Edit.mp4"
            type="video/mp4"
          />
        </video>

      </div>

    </main>


    <script
      src="../js/harandini.js?v=7"
    ></script>

  </body>
</html>
