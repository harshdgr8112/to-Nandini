<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Cutie Pie ❤️</title>

    <link
        rel="stylesheet"
        href="../css/funny.css"
    />
</head>

<body>
  

    <main class="funny-page">

        <!-- Stage background -->
        <div
            class="stage-background"
            aria-hidden="true"
        ></div>

        <!-- Video -->
        <div class="funny-stage">

            <video
                id="funnyVideo"
                class="funny-video"
                playsinline
                autoplay
                preload="auto"
            >
                <source
                    src="../assets/videos/cute edit.mp4"
                    type="video/mp4"
                />
            </video>

        </div>

    </main>

    <script src="../js/funny.js"></script>

</body>

</html>
