<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <meta
        name="description"
        content="A little birthday surprise."
    />

    <title>Happy Birthday ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="../css/birthday.css"
    />
</head>

<body>

    <main class="birthday-page">

        <div
            class="birthday-background"
            aria-hidden="true"
        ></div>

        <div
            class="birthday-glow birthday-glow--one"
            aria-hidden="true"
        ></div>

        <div
            class="birthday-glow birthday-glow--two"
            aria-hidden="true"
        ></div>


        <section class="birthday-hero">

            <p class="birthday-eyebrow">
                Package successfully delivered
            </p>

            <div
                class="birthday-sparkle"
                aria-hidden="true"
            >
                ✨
            </div>

            <h1>
                Happy Birthday,<br />
                <span>Kaju ❤️</span>
            </h1>

            <p class="birthday-subtitle">
                Finally...
                this delivery was actually meant for you.
            </p>

            <button
                id="openGiftBtn"
                class="open-gift-button"
                type="button"
            >
                Open your gift ✨
            </button>

            <p class="birthday-hint">
                There's a little more waiting inside...
            </p>

        </section>

    </main>


    <script src="../js/birthday.js"></script>

</body>
</html>
