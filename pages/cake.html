<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <meta
        name="description"
        content="A little birthday celebration."
    />

    <title>Happy Birthday Kaju 🎂</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="../css/cake.css"
    />
</head>

<body>

    <main class="cake-page">

        <!-- Soft birthday background -->
        <div
            class="cake-background"
            aria-hidden="true"
        ></div>

        <!-- Decorative party glow -->
        <div
            class="cake-glow"
            aria-hidden="true"
        ></div>


        <section class="cake-scene">

            <p class="cake-eyebrow">
                PACKAGE DELIVERED 🎁
            </p>

            <h1>
                Happy Birthday,
                <span>Kaju ❤️</span>
            </h1>

            <p class="cake-intro">
                Okay... enough verification.
                Ab birthday properly celebrate karte hain. 😌
            </p>


            


            <!-- =================================
                 CAKE
            ================================== -->

            <div
                id="cake"
                class="cake"
                aria-label="Birthday cake"
            >

                <div class="cake-plate"></div>

                <div class="cake-base">

                    <div class="cake-icing"></div>

                    <div class="cake-decoration">
                        ❤️
                    </div>

                    <div class="cake-text">
                        KAJU
                    </div>

                </div>


                <!-- Candles -->

                <div class="candles">

                    <div
                        class="candle"
                        data-candle="1"
                    >
                        <span class="flame"></span>
                    </div>

                    <div
                        class="candle"
                        data-candle="2"
                    >
                        <span class="flame"></span>
                    </div>

                    <div
                        class="candle"
                        data-candle="3"
                    >
                        <span class="flame"></span>
                    </div>

                    <div
                        class="candle"
                        data-candle="4"
                    >
                        <span class="flame"></span>
                    </div>

                    <div
                        class="candle"
                        data-candle="5"
                    >
                        <span class="flame"></span>
                    </div>

                </div>

            </div>


            <!-- =================================
                 INSTRUCTION
            ================================== -->

            <div class="cake-instruction">

                <p id="cakeMessage">
                    Make a wish first... ✨
                </p>

                <button
                    id="blowCandlesBtn"
                    class="blow-button"
                    type="button"
                >
                    Blow the candles 💨
                </button>

            </div>


            <!-- =================================
                 POST-BLOW MESSAGE
            ================================== -->

            <div
                id="cakeComplete"
                class="cake-complete"
                hidden
            >

                <div class="cake-complete-icon">
                    ✨
                </div>

                <h2>
                    Wish made ❤️
                </h2>

                <p>
                    I hope it comes true.
                    It better... I put a lot of effort
                    into this delivery. 😭
                </p>

                <button
                    id="continueCakeBtn"
                    class="continue-button"
                    type="button"
                >
                    Continue ✨
                </button>

            </div>

        </section>

    </main>


    <script src="../js/cake.js"></script>

</body>
</html>
