<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>A Little Something ❤️</title>

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/letter.css" />
  </head>

  <body>
    <main class="letter-page">
      <div class="letter-background" aria-hidden="true"></div>

      <section class="letter-hero">
        <p class="letter-eyebrow">For you, Kaju ❤️</p>

        <h1>
          There's a little<br />
          something inside...
        </h1>

        <div
          id="envelope"
          class="envelope"
          role="button"
          tabindex="0"
          aria-label="Open your letter"
        >
          <div class="envelope-back"></div>

          <div class="envelope-paper">
            <span>❤️</span>
          </div>

          <div class="envelope-front"></div>

          <div class="envelope-flap"></div>
        </div>

        <p id="letterHint" class="letter-hint">
          Tap the envelope to open it ✨
        </p>

        <div id="letterReveal" class="letter-reveal" hidden>
          <div class="photo-frame">
            <img
              src="../assets/images/img1.jpg"
              alt="A special memory"
            />
          </div>

          <p class="photo-caption">One of my favourite memories with you. ❤️</p>

          <div class="personal-letter">
            <p class="letter-greeting">Meri Kaju ❤️</p>

            <p>
              Is baar package thoda ajeeb tha... par andar jo hai na, woh sirf
              tumhare liye hai.
            </p>

            <p>Happy Birthday, meri Bacchu. 🥺❤️</p>
          </div>
        </div>
      </section>
    </main>

    <script src="../js/letter.js"></script>
  </body>
</html>
